[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-proxy"
version = "0.1.0"
description = "FastAPI-based proxy that fronts one or many vLLM backends and adapts requests for multiple CLI agents (Codex, Claude Code, OpenCode, ...)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "backend-proxy authors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
perf = ["uvloop>=0.19; sys_platform != 'win32'", "httptools>=0.6"]
metrics = ["prometheus-client>=0.19"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "anyio>=4.2",
]

[project.scripts]
backend-proxy = "backend_proxy.cli:main"
# Deprecated alias — emits a warning and forwards to backend-proxy. Will be
# removed in 0.3.x.
vllm-proxy = "backend_proxy.cli:main_legacy"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend_proxy*"]
exclude = ["tests*", "configs*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

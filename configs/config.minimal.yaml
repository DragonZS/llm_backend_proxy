# Minimal single-backend example. Equivalent to the legacy proxy_v1 setup
# (UPSTREAM=http://localhost:8080 PORT=9099).
server:
  host: 0.0.0.0
  port: 9099
  log_level: info

backends:
  - name: local-vllm
    type: vllm                               # default; can be omitted
    base_url: ${UPSTREAM:-http://localhost:8080}
    auth: { scheme: none }
